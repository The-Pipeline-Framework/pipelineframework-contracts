name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TPF_TELEMETRY_DISABLED: "true"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-path: ${{ github.workspace }}/.m2/repository
      - name: Verify staged artifact publisher handoff gate
        run: node --test scripts/require-monorepo-artifact-publishers-stop.test.mjs
      - name: Verify the canonical contract artifact
        run: ./mvnw -B clean verify -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2/repository" --no-transfer-progress
      - name: Set up Node for exact-number conformance
        # Exact-number checks use JSON.parse's source-token support.
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.4'
      - name: Check provisional polyglot contracts in Java, Node and Python
        run: |
          node --version
          python3 --version
          python3 -B -m unittest discover -s conformance/polyglot-v0 -p 'test_*.py'
          python3 conformance/polyglot-v0/run.py --skip-build
          python3 -B -m unittest discover -s conformance/polyglot-policy-v1 -p 'test_*.py'
          python3 conformance/polyglot-policy-v1/run.py --skip-build
      - name: Publish contracts coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contracts-coverage
          path: |
            **/target/site/jacoco/**
            **/target/jacoco.exec
          if-no-files-found: warn
          retention-days: 14
