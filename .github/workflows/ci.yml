name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify the canonical contract artifact
        run: ./mvnw -B clean verify -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2/repository" --no-transfer-progress
